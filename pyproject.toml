[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x3dlab"
version = "0.1.0"
description = "Colab notebooks and a shared toolkit for X3D: the x3d_mcp server, X_ITE, Blender, and LLMs, with a live dashboard."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The x3d_mcp fork imports mcp.server.fastmcp, which mcp 2.x removed (renamed MCPServer).
    # The client side used here (mcp.client.streamable_http) is pinned to the same major version.
    "mcp>=1.29,<2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "psutil>=5.9",
    "qrcode>=7.4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# What the x3d_mcp fork itself needs when it runs next to the lab (installed by x3dlab.install).
server = [
    "x3d>=4.0.65.5,<5",
    "lxml>=6.0",
    "xmlschema>=4.3",
    "jsonschema>=4.26",
    "rdflib>=7.0",
    "numpy>=1.26",
    "zstandard>=0.23",
    "brotli>=1.2.0",
]
notebook = ["ipywidgets>=8"]
tunnels = ["pyngrok>=7"]
dev = ["pytest>=8.0", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
x3dlab = ["static/**/*", "pins.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
